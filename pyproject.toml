[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "attestor"
version = "4.3.0"
description = "Hybrid security auditor: interprocedural dataflow + grounded LLM adjudication + dynamic confirmation"
requires-python = ">=3.10"

[project.optional-dependencies]
# Base install is defense-only and pure-stdlib. Offensive extras are opt-in so
# the red-team lane's dependencies are never pulled by a plain `pip install`.
redteam = ["requests>=2.28", "bcrypt>=4.0", "passlib>=1.7"]
# embedded in-process model runtime (loads a GGUF inside Attestor -- no server)
ai = ["llama-cpp-python>=0.2.90", "ollama>=0.3"]

[project.scripts]
attestor = "attestor.cli:main"

[tool.setuptools]
# Install detector/ as the `attestor` package. cli.py inserts its own directory
# onto sys.path at import, so the flat `import dataflow` style keeps working when
# installed -- without polluting the top-level module namespace.
package-dir = {"attestor" = "detector"}
packages = ["attestor"]

[tool.setuptools.package-data]
attestor = ["*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
