version: "3.9"

services:
  attestor:
    build: .
    ports:
      - "8844:8844"
    volumes:
      - ./scan-target:/scan:ro
      - attestor-memory:/home/attestor/.attestor
    environment:
      - ATTESTOR_API_KEY=${ATTESTOR_API_KEY:-}
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  attestor-memory:
  ollama-models:
